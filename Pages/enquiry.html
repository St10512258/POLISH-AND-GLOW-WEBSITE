<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Polish & Glow Nail Salon</title>
    <!-- Font Awesome Link for navigation/social icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-dark: #120917;         /* Deep purple background theme */
            --bg-card: #1d1126;         /* Slightly lighter purple blocks for clean container focus */
            --purple-glow: #d470ff;     /* Luminous light purple neon shine tint */
            --purple-neon: #ba55d3;     /* Main signature light purple accent color value */
            --text-light: #f3e8fa;      /* Clean off-white reading text */
            --text-muted: #c8b3d6;      /* Dimmed purple-gray description details */
            --input-focus: #311c40;     /* Dark accent highlight for form fields on focus */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* NAVIGATION HEADER LAYOUT */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(18, 9, 23, 0.95);
            border-bottom: 1px solid rgba(212, 112, 255, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: bold;
            color: #f7eaff;
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--purple-glow), 0 0 20px var(--purple-neon);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--purple-glow);
            text-shadow: 0 0 8px var(--purple-glow);
        }

        /* MOBILE MENU HAMBURGER NAVIGATION COMPONENT */
        .hamburger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            z-index: 1001;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: var(--text-light);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        /* MAIN WRAPPER CONTAINER */
        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .intro-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .intro-section h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .intro-section p {
            font-size: 1.1rem;
            color: var(--purple-glow);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* FORM BLOCK SYSTEM */
        .enquiry-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(212, 112, 255, 0.15);
            border-radius: 12px;
            padding: 40px 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px var(--purple-glow);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f7eaff;
            margin-bottom: 5px;
        }

        .form-hint {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-style: italic;
        }

        /* INPUT FIELD CONFIGURATIONS */
        .form-control {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-dark);
            border: 1px solid rgba(212, 112, 255, 0.2);
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s;
        }

        .form-control::placeholder {
            color: #5d486b;
        }

        .form-control:focus {
            border-color: var(--purple-glow);
            background-color: var(--input-focus);
            box-shadow: 0 0 8px rgba(212, 112, 255, 0.2);
        }

        select.form-control {
            cursor: pointer;
            color: var(--text-light);
        }

        select.form-control option {
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        /* SUBMIT BUTTON ACCENT STYLE */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--purple-neon), #9932cc);
            color: #fff;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(186, 85, 211, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 15px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--purple-glow);
        }

        /* FOOTER MODULE */
        footer {
            background-color: #0b050f;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #1a0f21;
            margin-top: 60px;
        }

        #myparagraph {
            font-size: 0.85rem;
            color: #7b6787;
        }

        /* MOBILE SCREENS INTERACTIVE RESPONSIVE MEDIA QUERIES */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .hamburger { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #120917;
                padding: 25px;
                border-bottom: 1px solid rgba(212, 112, 255, 0.15);
                text-align: center;
                gap: 20px;
            }
            .nav-links.active { display: flex; }
            .enquiry-card { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
            .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 5px); }
            .hamburger.active span:nth-child(2) { opacity: 0; }
            .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -5px); }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="nav-logo">Polish & Glow</a>
        
        <nav class="nav-links">
            <a href="../index.html">HOME</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html" class="active">Enquiry</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <main>
        <section class="intro-section">
            <h2>Polish & Glow Nail Salon</h2>
            <p>Beautiful Nails. Beautiful You.</p>
        </section>
        
        <div class="enquiry-card">
            <h1>Project Inquiry Form</h1>
            
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you! Your enquiry has been submitted successfully to Polish & Glow.');">
                
                <!-- Input Name Section -->
                <div class="form-group">
                    <label for="userName">Your Name</label>
                    <span class="form-hint">Tell us who you are</span>
                    <input type="text" id="userName" class="form-control" required placeholder="Enter your full name">
                </div>
                
                <!-- Input Email Section -->
                <div class="form-group">
                    <label for="userEmail">Email Address</label>
                    <span class="form-hint">Where we can find you</span>
                    <input type="email" id="userEmail" class="form-control" required placeholder="example@domain.com">
                </div>
                
                <!-- Select Menu Options Selection -->
                <div class="form-group">
                    <label for="projectType">Project Type</label>
                    <select id="projectType" class="form-control" required>
                        <option value="" disabled selected>---select---</option>
                        <option value="classic-manicure">Classic Manicure</option>
                <!-- This is the last input area of the form -->
                <div class="form-group">
                    <label for="userMessage">Message</label>
                    <textarea id="userMessage" class="form-control" rows="5" required placeholder="Write down details..."></textarea>
                </div>
                
                <!-- The submit button -->
                <button type="submit" class="submit-btn">Submit Enquiry</button>

            </form> <!-- This is the end of the form -->
